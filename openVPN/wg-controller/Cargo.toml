[package]
name = "wg-controller"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
log = "0.4"
env_logger = "0.11"
thiserror = "1.0"
async-trait = "0.1"
uuid = { version = "1.6", features = ["v4", "serde"] }
futures = "0.3"
regex = "1.10"
chrono = "0.4"
clap = { version = "4.4", features = ["derive"] }
dirs = "5.0"

# For CLI interaction
subprocess = "0.2"
which = "5.0"

# For REST API
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
hyper = "1.1"

# For configuration
directories = "5.0"
anyhow = "1.0"

# For cryptography (if needed)
sha2 = "0.10"
hex = "0.4"

# For Temporal workflow orchestration
# Note: Temporal Rust SDK integration will be added in next phase
# temporal-sdk = "0.1"

# For DeepSeek AI integration
reqwest = { version = "0.11", features = ["json"] }

[dev-dependencies]
mockito = "1.2"

[[bin]]
name = "wg-controller"
path = "src/main.rs"

[[bin]]
name = "wg-daemon"
path = "src/daemon.rs"

[[bin]]
name = "wg-worker"
path = "src/worker.rs"
