<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeShield</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 350px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #e2e8f0;
        }
        
        .container {
            padding: 16px;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        }
        
        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(59, 130, 246, 0.2);
        }

        .tt-logo {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #3b82f6 0%, #06b6d4 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 18px;
            color: white;
        }
        
        .header h1 {
            font-size: 18px;
            background: linear-gradient(135deg, #3b82f6 0%, #06b6d4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0;
        }
        
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }
        
        .stat-card {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.2);
            padding: 12px;
            border-radius: 8px;
            text-align: center;
        }
        
        .stat-number {
            font-size: 24px;
            font-weight: bold;
            background: linear-gradient(135deg, #3b82f6 0%, #06b6d4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 4px;
        }
        
        .stat-label {
            font-size: 12px;
            color: #94a3b8;
            text-transform: uppercase;
        }
        
        .toggle-group {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        
        .toggle-btn {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s;
            background: rgba(59, 130, 246, 0.05);
            color: #94a3b8;
        }
        
        .toggle-btn.active {
            background: linear-gradient(135deg, #3b82f6 0%, #06b6d4 100%);
            color: white;
            border-color: #3b82f6;
        }
        
        .toggle-btn.inactive {
            background: rgba(59, 130, 246, 0.05);
            color: #64748b;
        }
        
        .filter-list {
            background: rgba(59, 130, 246, 0.05);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
            max-height: 150px;
            overflow-y: auto;
            align-items: center;
            padding: 6px 0;
            font-size: 12px;
            border-bottom: 1px solid #ddd;
        }
        
        .filter-item:last-child {
            border-bottom: none;
        }
        
        .filter-item input[type="checkbox"] {
            margin-right: 8px;
            cursor: pointer;
        }
        
        .filter-item label {
            cursor: pointer;
            flex: 1;
        }
        
        .button-group {
            display: flex;
            gap: 8px;
        }
        
        .btn {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s;
            background: rgba(59, 130, 246, 0.05);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #3b82f6 0%, #06b6d4 100%);
            color: white;
            border-color: #3b82f6;
        }
        
        .btn-primary:hover {
            background: linear-gradient(135deg, #2563eb 0%, #0891b2 100%);
        }
        
        .btn-secondary {
            background: rgba(59, 130, 246, 0.1);
            color: #3b82f6;
        }
        
        .btn-secondary:hover {
            background: rgba(59, 130, 246, 0.2);
        }
        
        .footer {
            font-size: 11px;
            color: #94a3b8;
            text-align: center;
            padding-top: 12px;
            border-top: 1px solid rgba(59, 130, 246, 0.1);
            margin-top: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="tt-logo">TT</div>
            <h1>TradeShield</h1>
        </div>
        
        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="blockedCount">0</div>
                <div class="stat-label">Blocked</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="savedTime">0s</div>
                <div class="stat-label">Time Saved</div>
            </div>
        </div>

        <div style="background: rgba(59, 130, 246, 0.1); padding: 8px; border-radius: 6px; margin-bottom: 12px; font-size: 12px; color: #3b82f6; display: none; border: 1px solid rgba(59, 130, 246, 0.2);" id="mlStats">
            ML Blocked: 0 (0%)
        </div>
        
        <div class="toggle-group">
            <button class="toggle-btn active" id="enableBtn">Enabled</button>
            <button class="toggle-btn inactive" id="disableBtn">Disabled</button>
        </div>
        
        <div class="button-group">
            <button class="btn btn-secondary" id="detailsBtn">📊 Details</button>
            <button class="btn btn-secondary" id="optionsBtn">⚙️ Options</button>
            <button class="btn btn-secondary" id="resetBtn">🔄 Reset</button>
        </div>
        
        <div class="footer">
            <p>AdBlocker Plus v1.0.0</p>
            <p>Smart ad blocking with cosmetic filtering</p>
        </div>
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
