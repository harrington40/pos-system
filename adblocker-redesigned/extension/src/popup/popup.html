<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdBlocker Plus</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 350px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
        }
        
        .container {
            padding: 16px;
            background: white;
        }
        
        .header {
            display: flex;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #eee;
        }
        
        .header h1 {
            font-size: 18px;
            color: #667eea;
            margin: 0;
        }
        
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }
        
        .stat-card {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
        }
        
        .stat-number {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 4px;
        }
        
        .stat-label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
        }
        
        .toggle-group {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        
        .toggle-btn {
            flex: 1;
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s;
        }
        
        .toggle-btn.active {
            background: #667eea;
            color: white;
        }
        
        .toggle-btn.inactive {
            background: #e9ecef;
            color: #666;
        }
        
        .filter-list {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
            max-height: 150px;
            overflow-y: auto;
        }
        
        .filter-item {
            display: flex;
            align-items: center;
            padding: 6px 0;
            font-size: 12px;
            border-bottom: 1px solid #ddd;
        }
        
        .filter-item:last-child {
            border-bottom: none;
        }
        
        .filter-item input[type="checkbox"] {
            margin-right: 8px;
            cursor: pointer;
        }
        
        .filter-item label {
            cursor: pointer;
            flex: 1;
        }
        
        .button-group {
            display: flex;
            gap: 8px;
        }
        
        .btn {
            flex: 1;
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5568d3;
        }
        
        .btn-secondary {
            background: #e9ecef;
            color: #333;
        }
        
        .btn-secondary:hover {
            background: #dee2e6;
        }
        
        .footer {
            font-size: 11px;
            color: #999;
            text-align: center;
            padding-top: 12px;
            border-top: 1px solid #eee;
            margin-top: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>AdBlocker Plus</h1>
        </div>
        
        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="blockedCount">0</div>
                <div class="stat-label">Blocked</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="savedTime">0s</div>
                <div class="stat-label">Time Saved</div>
            </div>
        </div>

        <div style="background: #f0f4ff; padding: 8px; border-radius: 6px; margin-bottom: 12px; font-size: 12px; color: #667eea; display: none;" id="mlStats">
            ML Blocked: 0 (0%)
        </div>
        
        <div class="toggle-group">
            <button class="toggle-btn active" id="enableBtn">Enabled</button>
            <button class="toggle-btn inactive" id="disableBtn">Disabled</button>
        </div>
        
        <div class="button-group">
            <button class="btn btn-secondary" id="detailsBtn">📊 Details</button>
            <button class="btn btn-secondary" id="optionsBtn">⚙️ Options</button>
            <button class="btn btn-secondary" id="resetBtn">🔄 Reset</button>
        </div>
        
        <div class="footer">
            <p>AdBlocker Plus v1.0.0</p>
            <p>Smart ad blocking with cosmetic filtering</p>
        </div>
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
