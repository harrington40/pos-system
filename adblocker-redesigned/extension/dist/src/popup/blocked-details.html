<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blocked Ads - AdBlocker Plus</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            color: #333;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 16px;
            opacity: 0.9;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .stat-number {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 8px;
        }

        .stat-label {
            font-size: 14px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .controls {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #e9ecef;
            color: #333;
        }

        .btn-secondary:hover {
            background: #dee2e6;
        }

        .filter-group {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .filter-group label {
            font-size: 14px;
            font-weight: 600;
            color: #666;
        }

        .filter-group input {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }

        .blocked-list {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .blocked-item {
            padding: 15px 20px;
            border-bottom: 1px solid #eee;
            display: grid;
            grid-template-columns: 1fr auto auto auto;
            gap: 20px;
            align-items: center;
            transition: all 0.2s ease;
        }

        .blocked-item:last-child {
            border-bottom: none;
        }

        .blocked-item:hover {
            background: #f8f9fa;
        }

        .blocked-url {
            display: flex;
            flex-direction: column;
            gap: 5px;
            min-width: 0;
        }

        .blocked-domain {
            font-weight: 600;
            color: #667eea;
            word-break: break-all;
            font-size: 14px;
        }

        .blocked-path {
            font-size: 12px;
            color: #999;
            word-break: break-all;
            font-family: monospace;
        }

        .blocked-type {
            display: inline-block;
            background: #f0f4ff;
            color: #667eea;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .blocked-time {
            font-size: 12px;
            color: #999;
            text-align: right;
            white-space: nowrap;
        }

        .blocked-remove {
            cursor: pointer;
            color: #999;
            font-size: 18px;
            transition: color 0.2s ease;
        }

        .blocked-remove:hover {
            color: #e74c3c;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .empty-state h2 {
            font-size: 20px;
            margin-bottom: 10px;
            color: #666;
        }

        .empty-state p {
            font-size: 14px;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        .pagination button {
            padding: 8px 12px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 12px;
        }

        .pagination button:hover {
            border-color: #667eea;
            color: #667eea;
        }

        .pagination button.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        @media (max-width: 768px) {
            .blocked-item {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .blocked-item .blocked-type,
            .blocked-item .blocked-time,
            .blocked-item .blocked-remove {
                text-align: left;
            }

            .header {
                padding: 20px;
            }

            .header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🛡️ Blocked Ads</h1>
            <p>Detailed list of all ads and trackers blocked by AdBlocker Plus</p>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="totalBlocked">0</div>
                <div class="stat-label">Total Blocked</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="uniqueDomains">0</div>
                <div class="stat-label">Unique Domains</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="blockedToday">0</div>
                <div class="stat-label">Blocked Today</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="trackersBlocked">0</div>
                <div class="stat-label">Trackers Blocked</div>
            </div>
        </div>

        <div class="controls">
            <div class="filter-group">
                <label>Filter by domain:</label>
                <input type="text" id="filterInput" placeholder="e.g., google, facebook..." />
            </div>
            <button class="btn btn-secondary" onclick="clearAllHistory()">Clear History</button>
            <button class="btn btn-secondary" onclick="exportData()">Export</button>
            <button class="btn btn-primary" onclick="goBack()">← Back to Options</button>
        </div>

        <div class="blocked-list" id="blockedList">
            <div class="empty-state">
                <div class="empty-state-icon">📭</div>
                <h2>No blocked ads yet</h2>
                <p>Visit a website to see blocked ads and trackers here</p>
            </div>
        </div>
    </div>

    <script src="blocked-details.js"></script>
</body>
</html>
