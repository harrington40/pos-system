# OpenRx Stroke frontend on the Contabo 185 host.
#
# Deployed at /var/www/openrx-stroke/public/dist. API and WebSocket traffic is
# proxied to the existing live OpenRx service; this host has no local OpenRx
# backend or database. Install at
# /etc/nginx/sites-available/openrx-stroke and enable with a symlink.
server {
    listen 80;
    listen [::]:80;
    server_name vmi3393532.contaboserver.net;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vmi3393532.contaboserver.net;

    root /var/www/openrx-stroke/public/dist;
    index index.html;
    client_max_body_size 100M;

    ssl_certificate /etc/letsencrypt/live/vmi3393532.contaboserver.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vmi3393532.contaboserver.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /api/ {
        proxy_pass https://openrx.transtechologies.com;
        proxy_ssl_server_name on;
        proxy_set_header Host openrx.transtechologies.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /messaging/ {
        proxy_pass https://openrx.transtechologies.com;
        proxy_ssl_server_name on;
        proxy_set_header Host openrx.transtechologies.com;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 3600s;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ~ ^/app/(.*)$ {
        return 301 /$1;
    }
    location = /app {
        return 301 /;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
